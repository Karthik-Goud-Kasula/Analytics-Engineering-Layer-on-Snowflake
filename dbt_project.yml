name: "sec_analytics"
version: "1.1.0"
config-version: 2

profile: "sec_analytics"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

# Tested on dbt Core 1.12. See requirements.txt for the pinned toolchain.
require-dbt-version: [">=1.12.0", "<2.0.0"]

vars:
  # Schema the loader writes raw SEC files into (same database as the target).
  raw_schema: raw_sec
  # fct_financial_facts reprocesses rows loaded within this many hours of the
  # latest row it already holds. Absorbs overlapping or slow loads; the
  # unique_key makes reprocessing idempotent. See docs/DECISIONS.md #2.
  incremental_lookback_hours: 24
  # A restatement is "material" when revenue or net income moves by more than
  # this fraction of the original. 5% is the usual rule of thumb; SEC SAB 99
  # warns it is a starting point, not a bright line.
  materiality_threshold: 0.05
  # Balance-sheet identity tolerance, as a fraction of total assets. Filers round
  # each line item, so exact equality produces false failures.
  balance_sheet_tolerance_pct: 0.005
  # Sector-year benchmarks need at least this many companies to be published.
  min_companies_per_benchmark: 5
  # A fiscal year is "analysis ready" when this share of annual reports has
  # revenue and a balance sheet.
  analysis_ready_min_coverage: 0.9

models:
  sec_analytics:
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]

    intermediate:
      +schema: intermediate
      # Tables, not ephemeral: int_facts__classified and int_filings__deduplicated
      # each feed several models, and ephemeral would recompute them per consumer.
      +materialized: table
      +tags: ["intermediate"]

    marts:
      +schema: marts
      +materialized: table
      core:
        +tags: ["marts", "core"]
      finance:
        +tags: ["marts", "finance"]

seeds:
  sec_analytics:
    +schema: seeds
    +quote_columns: false
    financial_tag_mapping:
      +column_types:
        tag: varchar
        unit_of_measure: varchar
        concept: varchar
        statement: varchar
        priority: integer
    sic_sector_mapping:
      +column_types:
        # Integers, not strings: SIC codes in the SEC data have no leading zeros,
        # and a string BETWEEN would sort '730' after '7299'.
        sic_low: integer
        sic_high: integer
        sector: varchar
        industry_group: varchar
