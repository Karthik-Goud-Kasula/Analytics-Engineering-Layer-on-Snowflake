# Tool configuration only. Dependencies are pinned in requirements*.txt.

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["dbt_packages", "target", "logs"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion"]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
addopts = "-ra"
