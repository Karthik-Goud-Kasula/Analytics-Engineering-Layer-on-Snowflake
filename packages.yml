packages:
  # Pinned to an exact release tag so every clone resolves the same macros.
  # Installed from GitHub rather than hub.getdbt.com so `dbt deps` only needs
  # access to github.com; the package and version are the same either way.
  # To upgrade: bump the tag, run `dbt deps`, commit package-lock.yml.
  - git: "https://github.com/dbt-labs/dbt-utils.git"
    revision: "1.4.1"
